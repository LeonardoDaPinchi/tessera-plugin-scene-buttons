# Scene buttons: a light tile with up to three small keys on it. A tap on the tile switches the light (on to off, off
# to on, or presses the buttons you chose for each); a tap on a key turns on a scene; the "..." key opens a card
# with a brightness slider and a power key. It is the Tessera version of a Bubble Card button
# with sub-buttons. Every field is explained in docs/MANIFEST.md of tessera-plugins.
id: scene_buttons
version: 0.3.0
api: "0.12"
icon: gesture-tap-button
maintainer: LeonardoDaPinchi
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 4

permissions:
  # Every action the tile may call. input_button.press goes to the buttons named in the options; light.turn_on,
  # light.turn_off and light.toggle to the tile's own light; scene.turn_on to the scenes named in the options.
  home_assistant_actions: [input_button.press, light.turn_on, light.turn_off, light.toggle, scene.turn_on]

# The light's card, opened by the "..." key on the tile: a brightness slider and a power key.
cards:
  - { id: light, name: card_name }

tiles:
  - id: buttons
    name: tile_name
    icon: gesture-tap-button
    sizes: { min: 2x1, max: 4x2 }
    memory: 800
    # The light the tile shows: its state and brightness. light is a domain Tessera draws a tile for, so its entity
    # reaches the plugin on the released firmware too.
    domains: [light]
    attributes: [brightness]
    example: tile_example
    preview: { title: "{name}", value: "{state}" }
    options:
      - { id: press, kind: text, label: press, hint: press_hint }
      - { id: press_off, kind: text, label: press_off, hint: press_off_hint }
      - { id: scene1, kind: text, label: scene1, hint: scene_hint }
      - { id: label1, kind: text, label: label1, default: N }
      - { id: scene2, kind: text, label: scene2, hint: scene_hint }
      - { id: label2, kind: text, label: label2, default: A }
      - { id: scene3, kind: text, label: scene3, hint: scene_hint }
      - { id: label3, kind: text, label: label3, default: F }
