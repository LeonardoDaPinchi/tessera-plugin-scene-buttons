# Scene buttons: a tile of up to three keys, each a letter, from 1x1 (two rows) to 4x2. A tap on a key turns on its scene (scene.turn_on). It is
# the row of sub-buttons of a Bubble Card button, without the button: put Tessera's own light tile beside it for the
# light itself. Every field is explained in docs/MANIFEST.md of tessera-plugins.
id: scene_buttons
version: 0.5.0
api: "0.10"
icon: gesture-tap-button
maintainer: LeonardoDaPinchi
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 4

permissions:
  # The one action the tile calls: scene.turn_on on the scenes named in its options.
  home_assistant_actions: [scene.turn_on]

tiles:
  - id: keys
    name: tile_name
    icon: gesture-tap-button
    sizes: { min: 1x1, max: 4x2 }
    memory: 600
    example: tile_example
    options:
      - { id: scene1, kind: text, label: scene1, hint: scene_hint }
      - { id: label1, kind: text, label: label1, default: A }
      - { id: scene2, kind: text, label: scene2, hint: scene_hint }
      - { id: label2, kind: text, label: label2, default: F }
      - { id: scene3, kind: text, label: scene3, hint: scene_hint }
      - { id: label3, kind: text, label: label3, default: N }
      # How the keys look: the size of the letter (the largest that fits, or one the key is made to fit), and whether a key
      # is a raised field or the screen's accent colour.
      - id: text_size
        kind: choice
        label: text_size
        hint: text_size_hint
        default: auto
        choices:
          - { value: auto, label: size_auto }
          - { value: small, label: size_small }
          - { value: medium, label: size_medium }
          - { value: large, label: size_large }
          - { value: xlarge, label: size_xlarge }
          - { value: xxlarge, label: size_xxlarge }
      - id: key_style
        kind: choice
        label: key_style
        default: raised
        choices:
          - { value: raised, label: style_raised }
          - { value: accent, label: style_accent }
